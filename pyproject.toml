[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "annual-report-assistant"
version = "0.1.0"
description = "Evidence-first Chinese annual report assistant built on OpenHarness"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Annual Report Assistant contributors" },
]

dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "textual>=0.80.0",
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "mcp>=1.0.0",
    "pyperclip>=1.9.0",
    "pyyaml>=6.0",
    "questionary>=2.0.1",
    "watchfiles>=0.20.0",
    "croniter>=2.0.0",
    "slack-sdk>=3.0.0",
    "python-telegram-bot>=21.0.0",
    "discord.py>=2.0.0",
    "lark-oapi>=1.5.0",
]

[project.optional-dependencies]
reports = [
    "pypdf>=6.0,<7",
    "pdfplumber>=0.11,<0.12",
    "pypdfium2>=5.0,<6",
]
dev = [
    "pexpect>=4.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
annual-report-assistant = "openharness.annual_reports.__main__:main"
openharness = "openharness.cli:app"
oh = "openharness.cli:app"
openh = "openharness.cli:app"
ohmo = "ohmo.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/openharness", "ohmo"]

[tool.hatch.build]
exclude = [
    "/.git",
    "/.venv",
    "/.openharness-venv",
    "/.openharness",
    "/.pytest_cache",
    "/.mypy_cache",
    "/.ruff_cache",
    "/build",
    "/dist",
]

[tool.hatch.build.targets.wheel.force-include]
"data/annual_reports_demo" = "openharness/annual_reports/_demo"
"THIRD_PARTY_NOTICES.md" = "openharness/annual_reports/THIRD_PARTY_NOTICES.md"
"frontend/terminal/package.json" = "openharness/_frontend/package.json"
"frontend/terminal/package-lock.json" = "openharness/_frontend/package-lock.json"
"frontend/terminal/tsconfig.json" = "openharness/_frontend/tsconfig.json"
"frontend/terminal/src" = "openharness/_frontend/src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
